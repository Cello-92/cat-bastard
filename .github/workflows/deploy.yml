name: Deploy su GitHub Pages

# Ogni push su main ricostruisce il gioco e lo pubblica.
# Il link pubblico è quindi sempre allineato a quello che c'è nel repo:
# per vedere una modifica basta fare push e aspettare la fine del job.
on:
  push:
    branches: [main]
  # Permette di rilanciare il deploy a mano dalla tab Actions.
  workflow_dispatch:

# Permessi minimi necessari alla pubblicazione su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; i push successivi aspettano invece di sovrascriversi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Smoke test
        run: npm test

      - name: Typecheck + build
        run: npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
