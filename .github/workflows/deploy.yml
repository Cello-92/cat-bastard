name: Deploy su GitHub Pages

# Ogni push su main ricostruisce il gioco e lo pubblica.
# Il link pubblico è quindi sempre allineato a quello che c'è nel repo:
# per vedere una modifica basta fare push e aspettare la fine del job.
on:
  push:
    branches: [main]
  # Permette di rilanciare il deploy a mano dalla tab Actions.
  workflow_dispatch:

# Permessi minimi necessari alla pubblicazione su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; i push successivi aspettano invece di sovrascriversi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Smoke test
        run: npm test

      # Le due variabili del backend arrivano dai secrets del repo e finiscono
      # dentro al bundle. Se non ci sono, il gioco si costruisce lo stesso e
      # parte senza account e senza classifica: è voluto, così il deploy non si
      # rompe mai per colpa di una configurazione mancante.
      # Da impostare una volta con:
      #   gh secret set VITE_SUPABASE_URL
      #   gh secret set VITE_SUPABASE_ANON_KEY
      - name: Typecheck + build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Il timeout di default dell'action è 10 minuti, e allo scadere non si
      # limita a fallire: *annulla* la deployment. Se la coda di Pages è lenta
      # — cosa che succede, e il 6 agosto 2026 è successo per due merge di
      # fila — l'action ammazza da sola una pubblicazione che sarebbe arrivata,
      # e il sito resta indietro di un merge senza che niente sia rotto.
      # Trenta minuti: la coda si aspetta, non si uccide. E un report ogni 15
      # secondi invece di 5, altrimenti il log diventa un muro di righe uguali.
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          reporting_interval: 15000
