<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="Cat Bastard — un platform che ti odia. Rage game gratis nel browser.">
  <title>Cat Bastard</title>
</head>
<body>
  <div id="app">
    <div id="frame">
      <canvas id="stage" aria-label="Area di gioco" role="img"></canvas>

      <div id="hud" class="hud">
        <span class="hud__item">MORTI <b data-hud="deaths">0</b></span>
        <span class="hud__item">MONETE <b data-hud="coins">0</b></span>
        <span class="hud__item">TEMPO <b data-hud="time">0:00</b></span>
        <span class="hud__item hud__item--right" data-hud="level">1-1</span>
      </div>

      <div id="taunt" class="taunt"></div>

      <div id="pad" class="pad">
        <div class="pad__group">
          <button class="pad__key" data-action="left" aria-label="Sinistra">◀</button>
          <button class="pad__key" data-action="right" aria-label="Destra">▶</button>
        </div>
        <div class="pad__group">
          <button class="pad__key pad__key--menu" data-act="pause" aria-label="Pausa">II</button>
          <button class="pad__key" data-action="jump" aria-label="Salta">▲</button>
        </div>
      </div>

      <!-- Menu: le voci sono generate da ui/menu.ts, qui c'è solo il guscio. -->
      <section class="screen screen--menu is-hidden" data-screen="menu">
        <h1 class="logo">CAT<span>BASTARD</span></h1>
        <p class="tagline" data-menu-title></p>
        <div class="menu__body" data-menu-body hidden></div>
        <div class="menu__rows" data-menu-rows hidden></div>
        <!--
          Le voci e l'anteprima stanno affiancate solo nelle pagine "galleria"
          (i gatti). Altrove il riquadro è vuoto e il CSS lo toglie di mezzo.
        -->
        <div class="menu__stage">
          <nav class="menu" data-menu-list aria-label="Menu principale"></nav>
          <figure class="preview" data-preview hidden>
            <canvas class="preview__canvas" data-preview-canvas width="150" height="150"></canvas>
            <figcaption class="preview__caption" data-preview-caption></figcaption>
          </figure>
        </div>
        <p class="menu__hint" data-menu-hint></p>
        <p class="keys">↑ ↓ scegli · INVIO conferma · ESC indietro · F schermo intero</p>
      </section>

      <section class="screen is-hidden" data-screen="win">
        <h1 class="logo">SEI ARRIVATO<span>DAVVERO</span></h1>
        <p data-win="stats"></p>
        <button class="btn" data-act="again">ANCORA</button>
      </section>

      <!--
        Account: nickname e password, niente email. Il contenuto lo riscrive
        ui/account-dialog.ts a seconda di cosa si sta facendo; qui c'è solo il
        guscio. Sta per ultimo di proposito: è l'unica schermata che deve poter
        comparire sopra al menu.
      -->
      <section class="screen screen--account is-hidden" data-screen="account" aria-live="polite">
        <h2 class="account__title" data-account="title">UN NOME PER LA CLASSIFICA</h2>
        <p class="account__lead" data-account="lead"></p>

        <form class="account__form" data-account="form" hidden>
          <label class="account__field">
            <span>NICKNAME</span>
            <input
              data-account="nickname"
              type="text"
              name="nickname"
              autocomplete="username"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              maxlength="16"
              required
            >
          </label>
          <label class="account__field">
            <span>PASSWORD</span>
            <input
              data-account="password"
              type="password"
              name="password"
              autocomplete="current-password"
              maxlength="72"
              required
            >
          </label>
          <p class="account__error" data-account="error" hidden></p>
          <button class="btn" type="submit" data-account="submit">CREA</button>
        </form>

        <div class="account__actions" data-account="actions"></div>
        <p class="account__note" data-account="note"></p>
      </section>
    </div>

    <footer class="footer">suggerimento: la seconda volta che muori nello stesso punto non è sfortuna</footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
