name: Deploy su GitHub Pages

# Ogni push su main ricostruisce il gioco e lo pubblica.
# Il link pubblico è quindi sempre allineato a quello che c'è nel repo:
# per vedere una modifica basta fare push e aspettare la fine del job.
on:
  push:
    branches: [main]
  # Permette di rilanciare il deploy a mano dalla tab Actions.
  workflow_dispatch:

# Permessi minimi necessari alla pubblicazione su Pages.
# `actions: read` serve al passo di pubblicazione, che si cerca da solo l'id
# dell'artifact di questo run invece di farselo dare da un'action.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Un deploy alla volta; i push successivi aspettano invece di sovrascriversi.
concurrency:
  group: pages
  cancel-in-progress: false

# ---------------------------------------------------------------- versioni
#
# Le action sono tutte a un major che gira su **node24**, e non è un
# aggiornamento di cortesia: dal 16 giugno 2026 i runner eseguono le action
# JavaScript con node24 anche quando nel loro action.yml dichiarano node20, e
# dal 16 settembre 2026 node20 dal runner sparisce. Le versioni che c'erano
# prima dichiaravano tutte node20: prima warning, poi un deploy che non parte
# più. È un guasto diverso da quello della coda descritto più sotto e va tenuto
# distinto: quello lascia indietro il sito in silenzio, questo ferma il job e
# almeno si vede.
#
# Chi le aggiorna controlli una cosa sola: che il major nuovo dichiari
# `runs.using: node24` (sta nel suo action.yml). `actions/deploy-pages` non
# c'è più — il perché sta nel job `deploy`.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Stessa major con cui gira il runner e con cui si sviluppa in locale.
          # Vite 7 pretende ^20.19 || >=22.12, quindi 24 è dentro con margine.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Smoke test
        run: npm test

      # Le due variabili del backend arrivano dai secrets del repo e finiscono
      # dentro al bundle. Se non ci sono, il gioco si costruisce lo stesso e
      # parte senza account e senza classifica: è voluto, così il deploy non si
      # rompe mai per colpa di una configurazione mancante.
      # Da impostare una volta con:
      #   gh secret set VITE_SUPABASE_URL
      #   gh secret set VITE_SUPABASE_ANON_KEY
      - name: Typecheck + build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configura Pages
        uses: actions/configure-pages@v6

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ------------------------------------------------------------------ deploy
  #
  # Perché qui non c'è `actions/deploy-pages`, che sarebbe la strada ovvia.
  #
  # Quando la coda di Pages non serve la deployment entro il suo timeout,
  # quell'action non si limita a fallire: chiama `Canceling Pages
  # deployment...` e ammazza una pubblicazione che stava solo aspettando il suo
  # turno. In un repo dove `main` è la produzione è il guasto peggiore
  # possibile, perché non somiglia a un guasto: build verde, test verdi, e il
  # link pubblico fermo al merge prima. Il 6 agosto 2026 il mondo 3 è restato
  # offline così.
  #
  # E il timeout **non si può alzare**: 600000 ms non è il default dell'action,
  # è il suo massimo (`MAX_TIMEOUT` nel suo sorgente). Passandogli di più
  # risponde `timeout value is greater than the allowed maximum` e lo riporta a
  # dieci minuti. Con dieci minuti fissi e l'annullamento automatico in fondo,
  # ritentare non basta e anzi peggiora: l'id della deployment Pages **è** lo
  # SHA del commit, quindi il tentativo dopo ricrea *la stessa* deployment e se
  # l'annullamento non si è ancora propagato se la ritrova già cancellata. È
  # esattamente quello che si legge nel log del 6 agosto: primo tentativo dieci
  # minuti in coda e poi annullato, secondo e terzo `Deployment cancelled.` in
  # quindici secondi.
  #
  # Quindi qui la deployment si crea a mano — sono tre chiamate REST, le stesse
  # tre che fa l'action — e la si aspetta **senza mai annullarla**. È la sola
  # differenza sostanziale, ed è tutto il punto: se la coda è lenta il sito
  # esce comunque, in ritardo; e se il nostro tempo scade, la pubblicazione
  # resta viva e GitHub la porta a termine per conto suo. Il job fallisce e si
  # vede — che è la cosa giusta da fare quando non si sa — ma non lascia
  # indietro il sito per averlo ucciso da solo.
  #
  # Ritentare serve ancora, ma solo per gli stati di errore *definitivi*
  # (`deployment_failed` e compagnia): lì GitHub dice davvero "riprova", e la
  # deployment vecchia è finita, quindi ricrearla non inciampa in se stessa.
  # I 90 secondi in mezzo sono per la propagazione, come prima.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # L'attesa massima è 2 x 25 minuti più le pause: il tetto del job sta
    # sopra, se no lo taglia il runner a metà polling e non si capisce perché.
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          # Quanto aspettiamo la coda, per tentativo, e ogni quanto guardiamo.
          # 15 secondi invece di 5: un'attesa lunga a 5 secondi fa centinaia di
          # righe identiche, e il log va letto proprio quando va male.
          WAIT_SECONDS: '1500'
          POLL_SECONDS: '15'
          ATTEMPTS: '2'
        run: |
          set -euo pipefail

          api="repos/$GITHUB_REPOSITORY"

          # L'artifact è quello caricato dal job `build` di questo stesso run.
          # Si prende l'ultimo con quel nome: in un re-run parziale ce n'è più
          # d'uno e quello buono è il più recente.
          artifact_id=$(gh api "$api/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages")] | last | .id')
          if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
            echo "::error::Nessun artifact 'github-pages' in questo run."
            exit 1
          fi
          echo "Artifact github-pages: id $artifact_id"

          # Il token OIDC è quello che dimostra a Pages che la deployment
          # arriva da questo workflow. Nessuna audience: è quello che fa
          # `core.getIDToken()` senza argomenti, cioè quello che faceva
          # l'action.
          #
          # Si chiede **subito prima di ogni POST**, mai una volta sola in cima:
          # la firma dura pochi minuti, mentre fra un tentativo e l'altro qui ci
          # sono fino a venticinque minuti di coda più novanta secondi di pausa.
          # Un token preso all'inizio arriva al secondo tentativo già scaduto, e
          # la chiamata muore con `Invalid actions OIDC token due to Signature
          # has expired` (HTTP 400): il sito non esce e il guasto sembra di
          # Pages, mentre è nostro.
          get_oidc() {
            oidc_token=$(curl -sS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
            if [ -z "$oidc_token" ] || [ "$oidc_token" = "null" ]; then
              echo "::error::Token OIDC non ottenuto (serve id-token: write)."
              exit 1
            fi
          }

          # Crea la deployment. Se `gh` risponde proprio che la firma è
          # scaduta — capita se il token muore fra la richiesta e il POST — si
          # rigenera e si riprova **una** volta sola: è un ritentativo diverso
          # da quelli del ciclo, che valgono per gli stati di errore di Pages.
          create_deployment() {
            local out rc
            get_oidc
            out=$(gh api --method POST "$api/pages/deployments" \
              -F artifact_id="$artifact_id" \
              -f pages_build_version="$GITHUB_SHA" \
              -f oidc_token="$oidc_token" 2>&1) && rc=0 || rc=$?
            if [ "$rc" -ne 0 ] && grep -qi 'Signature has expired' <<<"$out"; then
              echo "::warning::Token OIDC scaduto fra la richiesta e il POST: lo rifaccio."
              get_oidc
              out=$(gh api --method POST "$api/pages/deployments" \
                -F artifact_id="$artifact_id" \
                -f pages_build_version="$GITHUB_SHA" \
                -f oidc_token="$oidc_token" 2>&1) && rc=0 || rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::Creazione della deployment fallita: $out"
              return 1
            fi
            printf '%s' "$out"
          }

          attempt=1
          while [ "$attempt" -le "$ATTEMPTS" ]; do
            echo "::group::Tentativo $attempt di $ATTEMPTS"

            created=$(create_deployment)

            # L'id lo dà la risposta; se non c'è, sta in fondo a status_url, e
            # in ultima istanza è lo SHA. Stessa scaletta dell'action.
            deployment_id=$(jq -r \
              '.id // (.status_url // "" | split("/") | last) // ""' <<<"$created")
            [ -n "$deployment_id" ] || deployment_id="$GITHUB_SHA"
            page_url=$(jq -r '.page_url // ""' <<<"$created")
            echo "Deployment $deployment_id creata per $GITHUB_SHA"

            deadline=$(( $(date +%s) + WAIT_SECONDS ))
            outcome=timeout
            while [ "$(date +%s)" -lt "$deadline" ]; do
              sleep "$POLL_SECONDS"
              status=$(gh api "$api/pages/deployments/$deployment_id" \
                --jq '.status' 2>/dev/null || echo 'unknown_status')
              echo "Stato: $status"
              case "$status" in
                succeed)
                  outcome=success
                  break
                  ;;
                deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                  outcome=failed
                  break
                  ;;
              esac
            done
            echo "::endgroup::"

            if [ "$outcome" = success ]; then
              echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
              echo "Pubblicato: $page_url"
              exit 0
            fi

            if [ "$outcome" = timeout ]; then
              # Qui **non** si annulla, ed è tutto il motivo per cui questo
              # passo esiste: la deployment resta in coda e GitHub la
              # pubblicherà da sé. Ritentare adesso ricreerebbe lo stesso id
              # mentre è ancora in volo, quindi si smette e si fallisce forte.
              echo "::error::La coda di Pages non ha servito la deployment in $((WAIT_SECONDS / 60)) minuti. NON è stata annullata: dovrebbe uscire da sola. Controllare la tab Actions > Pages prima di rilanciare."
              exit 1
            fi

            echo "::warning::Stato definitivo di errore ($status)."
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$ATTEMPTS" ]; then
              # 90 secondi perché l'id della deployment è lo SHA: ricrearla
              # troppo presto la ritrova nello stato vecchio.
              echo "Aspetto 90 secondi che lo stato si propaghi, poi ritento."
              sleep 90
            fi
          done

          echo "::error::Pubblicazione fallita dopo $ATTEMPTS tentativi."
          exit 1
