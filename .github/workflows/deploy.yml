name: Deploy su GitHub Pages

# Ogni push su main ricostruisce il gioco e lo pubblica.
# Il link pubblico è quindi sempre allineato a quello che c'è nel repo:
# per vedere una modifica basta fare push e aspettare la fine del job.
on:
  push:
    branches: [main]
  # Permette di rilanciare il deploy a mano dalla tab Actions.
  workflow_dispatch:

# Permessi minimi necessari alla pubblicazione su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; i push successivi aspettano invece di sovrascriversi.
concurrency:
  group: pages
  cancel-in-progress: false

# ---------------------------------------------------------------- versioni
#
# Le action sono tutte a un major che gira su **node24**, e non è un
# aggiornamento di cortesia: dal 16 giugno 2026 i runner eseguono le action
# JavaScript con node24 anche quando nel loro action.yml dichiarano node20, e
# dal 16 settembre 2026 node20 dal runner sparisce. Le versioni che c'erano
# prima dichiaravano tutte node20: prima warning, poi un deploy che non parte
# più. È un guasto diverso da quello della coda descritto più sotto e va tenuto
# distinto: quello lascia indietro il sito in silenzio, questo ferma il job e
# almeno si vede.
#
# Chi le aggiorna controlli due cose sole: che il major nuovo dichiari
# `runs.using: node24` (sta nel suo action.yml) e che `deploy-pages` accetti
# ancora `reporting_interval`, che è quello che rende leggibile il log dei tre
# tentativi.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Stessa major con cui gira il runner e con cui si sviluppa in locale.
          # Vite 7 pretende ^20.19 || >=22.12, quindi 24 è dentro con margine.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Smoke test
        run: npm test

      # Le due variabili del backend arrivano dai secrets del repo e finiscono
      # dentro al bundle. Se non ci sono, il gioco si costruisce lo stesso e
      # parte senza account e senza classifica: è voluto, così il deploy non si
      # rompe mai per colpa di una configurazione mancante.
      # Da impostare una volta con:
      #   gh secret set VITE_SUPABASE_URL
      #   gh secret set VITE_SUPABASE_ANON_KEY
      - name: Typecheck + build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configura Pages
        uses: actions/configure-pages@v6

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Il link va preso dal tentativo che è andato a buon fine, non dal primo:
      # se il primo ha fallito il suo `page_url` è vuoto e l'ambiente
      # comparirebbe senza link proprio nei run in cui serve guardarlo.
      name: github-pages
      url: >-
        ${{ steps.deployment.outputs.page_url
            || steps.deployment2.outputs.page_url
            || steps.deployment3.outputs.page_url }}
    steps:
      # Perché tre tentativi invece di uno.
      #
      # Quando la coda di Pages non serve la deployment entro il suo timeout,
      # `deploy-pages` non si limita a fallire: chiama `Canceling Pages
      # deployment...` e ammazza la pubblicazione. In un repo dove `main` è la
      # produzione questo è il guasto peggiore possibile, perché non somiglia a
      # un guasto: build verde, test verdi, e il link pubblico fermo al merge
      # prima. Il 6 agosto 2026 il mondo 3 è restato offline così.
      #
      # E il timeout **non si può alzare**: 600000 ms non è il default
      # dell'action, è il suo massimo. Passandogli di più risponde `timeout
      # value is greater than the allowed maximum` e lo riporta a dieci minuti.
      # Quindi l'unica leva che resta è ritentare.
      #
      # Ritentare funziona perché la coda è intermittente, non morta: nella
      # mezz'ora del guasto un tentativo su cinque è passato in 4 minuti. I 90
      # secondi di attesa in mezzo non sono decorativi: una deployment ricreata
      # subito dopo il proprio annullamento torna indietro già cancellata (è
      # successo, 50 secondi dopo), perché l'id della deployment Pages *è* lo
      # SHA del commit e l'annullamento precedente deve prima propagarsi.
      #
      # `reporting_interval` a 15 secondi invece di 5 perché tre attese da dieci
      # minuti a 5 secondi di polling fanno trecentosessanta righe identiche, e
      # il log va letto proprio quando va male.
      - name: Pubblica
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 15000

      - name: Aspetta che l'annullamento si propaghi
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Ripubblica (2° tentativo)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 15000

      - name: Aspetta che l'annullamento si propaghi
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 90

      - name: Ripubblica (3° tentativo)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 15000
